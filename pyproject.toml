[tool.poetry]
name = "viewser"
version = "6.6.4"
description = "The Views 3 CLI tool"
authors = ["peder2911 <pglandsverk@gmail.com>"]
readme = "README.md"
homepage = "https://www.github.com/prio-data/viewser"
license = "CC-BY-NC"

[tool.poetry.dependencies]
python = "^3.9"
requests = "^2.27.1"
environs = "^9.3.1"
pydantic = "^2.0.0"
click = "^8.0.1"
toolz = "^0.11.1"
views-schema = "^2.3.0"
toml = "^0.10.2"
strconv = "^0.4.2"
views-storage = "^1.1.0"
tqdm = "^4.66.0"
ipython = "^8.22.2"
views_tensor_utilities = ">=1.0.0"
pyod = "<1.1.0"
pandas = "^1.4.0"
numpy = "^1.2.0"

[tool.poetry.scripts]
viewser = "viewser.cli:viewser"

[tool.poetry.dev-dependencies]
pytest = "^5.2"
httpretty = "^1.1.3"
responses = "^0.13.3"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
